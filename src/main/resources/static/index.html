<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentChat · 智能对话</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/console.css">
</head>
<body>
<div class="app">
  <div class="sidebar-mask" id="sidebarMask"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">AgentChat</div>
      <div class="brand-sub">AgentScope · 智能对话</div>
    </div>
    <button class="new-chat" id="btnNew" type="button">＋ 新建对话</button>
    <div class="search-box">
      <input id="convSearch" type="search" placeholder="搜索对话" autocomplete="off">
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <button class="icon-btn" id="btnTheme" type="button" title="切换主题">🌙</button>
      <button class="icon-btn" id="btnKnowledge" type="button" title="知识库">📚</button>
      <button class="icon-btn" id="btnAdmin" type="button" title="管理控制台">⚙️</button>
      <span class="footer-note">知识库 · MCP · 技能</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="btnMenu" type="button" title="菜单">☰</button>
      <div class="conv-title" id="convTitle">新对话</div>
      <div class="mode-switch" id="modeSwitch">
        <button type="button" data-mode="chat" class="active">对话</button>
        <button type="button" data-mode="deep">深度思考</button>
        <button type="button" data-mode="orchestrate" title="多 Agent 编排：统筹规划后分派给多个 Agent">多 Agent</button>
      </div>
      <label class="parallel-toggle" id="parallelToggle" hidden
             title="各 Agent 并行执行，再由汇总模型合成一段最终答复">
        <input type="checkbox" id="parallelCheck">并行+汇总
      </label>
      <select class="model-picker" id="modelPicker" title="本会话使用的语言模型" hidden></select>
      <button class="icon-btn" id="btnMap" type="button" title="打开数字地球窗口" aria-label="打开数字地球窗口">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>
        </svg>
      </button>
      <div class="health-badge" id="healthBadge" title="组件状态">在线</div>
      <div class="user-chip" id="userChip">
        <button class="user-btn" id="userMenuBtn" type="button" title="当前用户">
          <span class="user-avatar" id="userAvatar">U</span>
          <span class="user-name" id="userName">未登录</span>
        </button>
        <div class="user-menu" id="userMenu" hidden>
          <div class="user-meta" id="userMeta"></div>
          <button type="button" data-action="profile">我的画像</button>
          <button type="button" data-action="memory">我的记忆</button>
          <button type="button" data-action="admin">管理控制台</button>
          <button type="button" data-action="login">登录 / 切换账号</button>
          <button type="button" data-action="logout" class="danger">退出登录</button>
        </div>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer">
      <div class="composer-files" id="attachments"></div>
      <div class="composer-box">
        <button class="attach-btn" id="btnAttach" type="button" title="上传文件" aria-label="上传文件">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="给 AgentChat 发送消息…"></textarea>
        <button class="send-btn" id="btnSend" type="button" title="发送">➤</button>
      </div>
      <input type="file" id="fileInput" multiple hidden
             accept=".pdf,.docx,.xlsx,.xls,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.log,.yaml,.yml,.xml,.html,.htm,.sql,.properties,.ini,.conf,.sh,.bat,.ps1,.java,.py,.js,.ts,.css">
      <div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 支持 PDF/Word/Excel/文本/代码</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="console" id="console" hidden>
  <aside class="console-nav">
    <div class="console-brand">
      <span class="console-logo">A</span>
      <div>
        <b>AgentChat</b>
        <small>管理控制台</small>
      </div>
    </div>
    <nav class="console-links" id="consoleNav">
      <button type="button" data-section="overview"><span class="console-ico">◈</span>概览</button>
      <button type="button" data-section="profile"><span class="console-ico">☺</span>我的画像</button>
      <button type="button" data-section="users"><span class="console-ico">☾</span>用户与角色</button>
      <button type="button" data-section="knowledge"><span class="console-ico">▤</span>知识库</button>
      <button type="button" data-section="models"><span class="console-ico">◌</span>模型</button>
      <button type="button" data-section="mcp"><span class="console-ico">⇄</span>MCP</button>
      <button type="button" data-section="skills"><span class="console-ico">✦</span>技能</button>
      <button type="button" data-section="memory"><span class="console-ico">◍</span>记忆</button>
      <button type="button" data-section="logs"><span class="console-ico">≡</span>日志</button>
      <button type="button" data-section="settings"><span class="console-ico">⚙</span>设置</button>
    </nav>
    <div class="console-nav-foot">
      <button class="console-back" id="consoleBack" type="button">← 返回聊天</button>
      <span class="console-version">RAG · Milvus 3.0</span>
    </div>
  </aside>
  <main class="console-main">
    <header class="console-head">
      <div class="console-head-text">
        <h1 id="consoleTitle">概览</h1>
        <p id="consoleSubtitle">智能体、知识库与运行时状态</p>
      </div>
      <div class="console-actions">
        <button class="btn-sm" id="consoleRefresh" type="button">刷新</button>
        <button class="btn-sm" id="consoleClose" type="button" title="关闭（Esc）">关闭</button>
      </div>
    </header>
    <div class="console-body" id="consoleBody"></div>
  </main>
</div>

<script src="/js/marked.min.js"></script>
<script src="/js/highlight.min.js"></script>
<script src="/js/dompurify.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
